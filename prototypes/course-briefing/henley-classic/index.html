<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- A course briefing for one event, the Henley Classic: a prototype for organiser walkthroughs. NOT part of the site:
     scripts/build_site.py copies nothing from prototypes/course-briefing/, and tests/test_course_briefing.py checks
     that. Serve the repository root and open this folder; it reads course.json beside it, made by
     scripts/course_briefing.py (docs/COURSE-BRIEFING-HENLEY-2026-11.md). The stylesheet, the fonts and the overflow
     names are the site's own. -->
<title>Henley Classic course briefing · SwimSignal prototype</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A prototype: where the water-quality evidence changes along the Henley Classic course, why, and what is not known, on three past dates.">
<link rel="stylesheet" href="../../../src/dipcast/pages/page.css">
<link rel="stylesheet" href="../course.css">
</head>
<body>
<!-- A stand-in for a repository preview, as the Research Lab's prototypes have. -->
<header class="top"><a class="brand" href="https://swimsignal.co.uk/">SwimSignal</a></header>
<main class="doc" id="course" aria-live="polite">
  <h1>Henley Classic: course briefing</h1>
  <p class="dateline">A prototype, not published.</p>
  <p>Loading the course…</p>
  <noscript><p>This page needs JavaScript to lay the course out.</p></noscript>
</main>
<script src="../../../src/dipcast/site/levels.js"></script>
<script src="../course.js"></script>
<script>
  fetch('course.json').then(r => { if (!r.ok) throw new Error(`course.json answered ${r.status}`); return r.json(); })
    .then(doc => CourseBrief.draw(document.getElementById('course'), doc))
    .catch(e => { document.getElementById('course').innerHTML = `<h1>Henley Classic: course briefing</h1><p>The course file did not load, so there is nothing to show. ${String(e.message).replace(/[<&]/g, '')}</p>`; });
</script>
</body>
</html>
