[[fact]]
topic = "rules"
text = "The park authority's lakes guide lists swimming at Loweswater as allowed. Canoes, kayaks, paddleboards and rowing boats under 4 m need a permit; sailing boats and powered craft are not allowed. The small lakes byelaws apply. It names the National Trust as the contact."
