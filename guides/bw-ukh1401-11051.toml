[[fact]]
topic = "rules"
text = "The River Stour Trust owns the jetty at Friars Meadow and says its jetties are only for people in licensed craft navigating the river, not for other uses; it also asks people not to picnic or loiter on them. The trust's page does not mention the bathing site."
