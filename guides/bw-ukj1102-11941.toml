# Pangbourne Meadow, River Thames. Desk check of the operator's pages and the Environment Agency profile, 3 October 2026.
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-03
how = "desk"

[[fact]]
topic = "path"
text = "The site is a big grassy meadow on the south bank of the Thames just downstream of Whitchurch Bridge in Pangbourne, and is easy to reach by public transport."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=ukj1102-11941"
source_name = "Environment Agency bathing water profile"

[[fact]]
topic = "parking"
text = "There is a paying public car park."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=ukj1102-11941"
source_name = "Environment Agency bathing water profile"

[[fact]]
topic = "parking"
text = "Pangbourne River Meadow Car Park, Whitchurch Road, RG8 7BS, has 27 spaces, two for Blue Badge holders. Monday to Sunday 8am to 6pm: up to 1 hour £1.10, 2 hours £1.60, 3 hours £2.10, 4 hours £2.70, over 4 hours £6.40; evenings 6pm to 8am £1.10. Pay by cash, card or PayByPhone (code 7182). The council's car park page does not mention the bathing site."
status = "confirmed"
source = "https://www.westberks.gov.uk/pangbourne-river-meadow-car-park"
source_name = "West Berkshire Council"

[[fact]]
topic = "toilets"
text = "The parish council's recreation area includes a car park and public toilets. The parish council's page does not mention the bathing site."
status = "confirmed"
source = "https://www.pangbourne-pc.gov.uk/Recreation_Areas_29641.aspx"
source_name = "Pangbourne Parish Council"

