[[fact]]
topic = "parking"
text = "Sandy Lane Park (Sandy Lane, Chester CH3 5UL) has vehicle access off Sandy Lane into a surfaced car park for about 40 cars. The council's page does not mention the bathing site."
status = "confirmed"
source = "https://www.cheshirewestandchester.gov.uk/residents/leisure-parks-and-events/parks-and-open-spaces/parks-and-open-spaces-chester/sandy-lane-park-and-aqua-park"
source_name = "Cheshire West and Chester Council"

[[fact]]
topic = "toilets"
text = "At Sandy Lane Park, the Aqua Park and toilets open only in the summer season (April to August), 11am to 5pm. An attendant keeps the toilets and park clean. The council's page does not mention the bathing site."
status = "confirmed"
source = "https://www.cheshirewestandchester.gov.uk/residents/leisure-parks-and-events/parks-and-open-spaces/parks-and-open-spaces-chester/sandy-lane-park-and-aqua-park"
source_name = "Cheshire West and Chester Council"

[[fact]]
topic = "toilets"
text = "The council lists Sandy Lane Chester toilets (Sandy Lane, CH3 5UU) with Radar key access, changing facilities and separate men's and women's toilets. The council's page does not mention the bathing site."
status = "confirmed"
source = "https://www.cheshirewestandchester.gov.uk/residents/streets-and-open-spaces/public-toilets"
source_name = "Cheshire West and Chester Council"

[[fact]]
topic = "rules"
text = "The Sandy Lane Ferry carries passengers across the Dee from Sandy Lane to the Meadows every weekend from 23 May 2026 to the last Sunday in September, 10.30am to 4.30pm. Fares each way: adults £1; children, dogs and bikes 50p. The council's page does not mention the bathing site."
status = "confirmed"
source = "https://www.cheshirewestandchester.gov.uk/residents/leisure-parks-and-events/parks-and-open-spaces/parks-and-open-spaces-chester/sandy-lane-park-and-aqua-park"
source_name = "Cheshire West and Chester Council"

[[fact]]
topic = "rules"
text = "Cheshire West and Chester Council says swimming in the River Dee currently isn't encouraged, because the river can contain sewage, livestock contamination and pollution from farming or industry. It says this in its section on the Sandy Lane bathing water."
status = "confirmed"
