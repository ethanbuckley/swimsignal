# Ullswater, Glenridding. Desk check of the landowners' and park authorities' pages, 3 October 2026.
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-03
how = "desk"

[[fact]]
topic = "parking"
text = "Glenridding car park is pay and display (coins and cards) with coach parking, EV chargers, toilets including disabled, and the Tourist Information Centre."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/visitor-facilities/car-parks-and-parking/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "parking"
text = "Pier and Jenkins Field car park in Glenridding is pay and display and has toilets."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/visitor-facilities/car-parks-and-parking/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "parking"
text = "Glenridding car park can also be paid by RingGo, car park ID 37316."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/visitor-facilities/car-parks-and-parking/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "path"
text = "The Ullswater Information Centre is next to the large visitor car park in Glenridding (Beckside Car Park, CA11 0PD), on the west shore. The 508 bus stops in the car park, 100 yards from the centre."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/information-centres/ullswater-information-centre/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "path"
text = "Ullswater Steamers run all year between Pooley Bridge and Glenridding Pier, which is 100 m from the information centre."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/information-centres/ullswater-information-centre/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "toilets"
text = "There are public toilets in Glenridding's main car park next to the Ullswater Information Centre, with baby changing if you have a RADAR key or ask staff. Jenkins Field also has toilets."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/visitor-facilities/public-toilets/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "rules"
text = "Swimming is allowed on Ullswater. Canoes, kayaks, paddleboards, rowing and sailing boats are allowed, and powered craft too, with a 10 mph speed limit."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/things-to-do/on-the-water/lakes-activities-guide/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "rules"
text = "The park authority lists Ullswater among the busier lakes, with motorboats, sailing boats and other craft. It recommends swimming along the shoreline and making yourself visible."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/things-to-do/on-the-water/swimming-in-the-lake-district/"
source_name = "Lake District National Park Authority"
