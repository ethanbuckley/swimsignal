# Windermere, Rayrigg Meadow. Desk check of the operator's pages and the Environment Agency profile, 3 October 2026.
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-03
how = "desk"

[[fact]]
topic = "entry"
text = "The Environment Agency says the beach at Rayrigg Meadow is shallow sloping and made of gravel, with larger rocks towards the water's edge."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=ukd1203-45675"
source_name = "Environment Agency bathing water profile"

[[fact]]
topic = "entry"
text = "The council lists lake frontage with public jetties and swimming areas among the facilities at Rayrigg Meadow."
status = "confirmed"
source = "https://www.westmorlandandfurness.gov.uk/parks-culture-and-leisure/parks-and-open-spaces/parks-and-public-gardens/rayrigg-meadow"
source_name = "Westmorland and Furness Council"

[[fact]]
topic = "path"
text = "The council says Rayrigg Meadow has an accessible path to the lake shore."
status = "confirmed"
source = "https://www.westmorlandandfurness.gov.uk/parks-culture-and-leisure/parks-and-open-spaces/parks-and-public-gardens/rayrigg-meadow"
source_name = "Westmorland and Furness Council"

[[fact]]
topic = "parking"
text = "Rayrigg Meadow car park (LA23 1BP) is open all day, seven days a week, with charges from 8am to 8pm. It has 45 general and 5 disabled spaces, no height limit, and takes coins or pay by phone (code 9902)."
status = "confirmed"
source = "https://www.westmorlandandfurness.gov.uk/parking-streets-and-transport/parking/find-car-park-near-you/rayrigg-meadow-car-park"
source_name = "Westmorland and Furness Council"

[[fact]]
topic = "parking"
text = "The car park charges £2.60 for up to 1 hour, £4.40 up to 2 hours, £5.80 up to 3, £7.40 up to 4, £8.80 up to 6 and £10.60 all day. Motorcycles park free, and Blue Badge holders get an extra free hour with a clock disc."
status = "confirmed"
source = "https://www.westmorlandandfurness.gov.uk/parking-streets-and-transport/parking/find-car-park-near-you/rayrigg-meadow-car-park"
source_name = "Westmorland and Furness Council"

[[fact]]
topic = "toilets"
text = "The town council runs toilets at Rayrigg Meadow car park, open 7am to 7pm, with a Changing Places room opened by Radar key. Its toilets cost 60p, contactless only; Radar key holders use them free."
status = "confirmed"
source = "https://www.windermere-tc.gov.uk/council-services/public-toilets/"
source_name = "Windermere and Bowness Town Council"

[[fact]]
topic = "rules"
text = "The National Park Authority says swimming is allowed on Windermere. Powered craft must be registered, and there is a 10 nautical mph speed limit, or 6 in some places. The page is about the whole lake and does not name the bathing site."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/things-to-do/on-the-water/lakes-activities-guide/"
source_name = "Lake District National Park Authority"
