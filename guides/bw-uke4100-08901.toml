# Wharfe at Cromwheel, Ilkley. Desk check of the operator's pages and the Environment Agency profile, 3 October 2026; more facts, and every fact rechecked, 20 October 2026.
# Bus and train added from Northern's and First Bus's own pages, and every other fact rechecked against its page, 30 October 2026 (docs/ARRIVAL-GUIDE-2026-10.md).
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-30
how = "desk"

[[fact]]
topic = "path"
text = "Reached from the Riverside Walk footpath beside the river. The bathing site is upstream of the suspension bridge."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=uke4100-08901"
source_name = "Environment Agency bathing water profile"

[[fact]]
topic = "entry"
text = "When the river is low, a gently sloping shingle beach is exposed."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=uke4100-08901"
source_name = "Environment Agency bathing water profile"

[[fact]]
topic = "parking"
text = "On-street parking on New Brook Street near the start of the Riverside Gardens walk, or a pay and display car park in the town centre. This leaflet is for the riverside walk; it does not mention the Cromwheel bathing site."
status = "confirmed"
source = "https://www.bradford.gov.uk/media/2070/riversidegardensilkley.pdf"
source_name = "Bradford Council"

[[fact]]
topic = "parking"
text = "Denton Road car park, LS29 0BZ: 93 spaces, 4 for disabled drivers. £1 an hour, £4 over 3 hours, charged 8am to 6pm every day. The council's list does not link it to the Cromwheel bathing site."
status = "confirmed"
source = "https://www.bradford.gov.uk/transport-and-travel/parking/car-parks-in-ilkley-addingham-and-burley-in-wharfedale/"
source_name = "Bradford Council"

[[fact]]
topic = "transport"
text = "Northern's page for Ilkley station (Station Plaza, LS29 8HF) lists direct trains to Leeds and to Bradford Forster Square, and says there is level access to both platforms. It lists no toilets at the station. The page does not mention the river or the bathing site."
status = "confirmed"
source = "https://www.northernrailway.co.uk/stations/ilkley"
source_name = "Northern"

[[fact]]
topic = "transport"
text = "First Bus says its X84 runs from Ilkley to Leeds city centre, and gives the usual travel time between them as 1 hour 25 minutes. The page names no stop near the bathing site."
status = "confirmed"
source = "https://www.firstbus.co.uk/west-yorkshire/your-services/featured-services/x84"
source_name = "First Bus"

[[fact]]
topic = "toilets"
text = "Riverside Gardens public toilets: four unisex cubicles, one accessible by ramp (radar key, card or coins). 40p by contactless card or coins. Open 8am to 8pm in summer, 9am to 6pm in winter. The council's page does not say how far they are from the Cromwheel bathing site."
status = "confirmed"
source = "https://www.ilkleytowncouncil.gov.uk/services/toilets/"
source_name = "Ilkley Town Council"

[[fact]]
topic = "path"
text = "Bradford Council's Riverside Gardens walk leaflet starts at a gap in the fence on New Brook Street, at the north end of the road bridge, where a ramp leads down to the Riverside path. The walk follows the river downstream and later crosses it by the suspension bridge. The leaflet does not mention the bathing site."
status = "confirmed"
source = "https://www.bradford.gov.uk/media/2070/riversidegardensilkley.pdf"
source_name = "Bradford Council"

[[fact]]
topic = "toilets"
text = "Defra's 2020 consultation on the designation says there are public toilets at the nearby Lido, an outdoor pool run by Bradford Council, open from May to early September. It does not say how far the Lido is from the bathing site."
status = "confirmed"
source = "https://consult.defra.gov.uk/water/bathing-water-river-wharfe-ilkley/supporting_documents/Consultation%20Document%20for%20the%20River%20Wharfe.pdf"
source_name = "Defra"
source_date = "2020-08"

[[fact]]
topic = "rules"
text = "Defra's 2020 decision says that in the bathing season Bradford Council is responsible for public information on water quality and for warning signs during pollution incidents, as advised by the Environment Agency. It says managing the physical risks in rivers is outside the bathing water rules."
status = "confirmed"
source = "https://www.gov.uk/government/consultations/bathing-waters-designation-of-an-area-of-the-river-wharfe-ilkley/outcome/summary-of-responses-and-government-response"
source_name = "Defra"
source_date = "2020-12"

[[fact]]
topic = "rules"
text = "Bradford Council's parks site says an event in its parks needs permission if more than 20 people are expected, if it is advertised or open to the public, if there is a charge, or if it is a sporting event. It asks for at least four weeks' notice. The page covers all its parks and does not name the river or the bathing site."
status = "confirmed"
source = "https://bradforddistrictparks.org/things-to-do/event-enquiries/"
source_name = "Bradford Council (Bradford District Parks)"

