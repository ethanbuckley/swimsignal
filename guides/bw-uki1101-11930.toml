# Hampstead Heath, Mixed Pond. Desk check of the operator's pages and the Environment Agency profile, 3 October 2026.
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-03
how = "desk"

[[fact]]
topic = "parking"
text = "East Heath Car Park: 110 spaces and a disabled parking area. £3.50 an hour for up to 4 hours, then £11.30 an hour; pay by RingGo (location 79453). Blue Badge parking is free once registered. Open 7am, locked from 9pm."
status = "confirmed"
source = "https://www.cityoflondon.gov.uk/things-to-do/green-spaces/hampstead-heath/where-to-go-at-hampstead-heath/east-heath-car-park"
source_name = "City of London Corporation"

[[fact]]
topic = "path"
text = "Near East Heath Road, reached by road-like surfaces and an unmade track. Hampstead Heath (Overground) is a 10-minute walk, Hampstead (Northern line) 17 minutes."
status = "confirmed"
source = "https://www.cityoflondon.gov.uk/things-to-do/green-spaces/hampstead-heath/where-to-go-at-hampstead-heath/mixed-pond"
source_name = "City of London Corporation"

[[fact]]
topic = "entry"
text = "Ladders into the water, and a hoist for assisted access."
status = "confirmed"
source = "https://www.cityoflondon.gov.uk/things-to-do/green-spaces/hampstead-heath/where-to-go-at-hampstead-heath/mixed-pond"
source_name = "City of London Corporation"

[[fact]]
