[[fact]]
topic = "parking"
text = "New Forest District Council's Fordingbridge Car Park (SP6 1AQ) has 178 short-stay spaces (3-hour limit) and 99 long-stay spaces (20-hour limit). 2026 charges apply 8am to 6pm every day including bank holidays, from £1.55 for 1 hour up to £8.60 for 20 hours. It has toilets. The council's page does not mention the bathing site."
status = "confirmed"
