# Wolvercote Mill Stream. Desk check of the operator's pages and the Environment Agency profile, 3 October 2026.
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-03
how = "desk"

[[fact]]
topic = "parking"
text = "Access to the swimming area is via the Wolvercote car park."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=ukj1402-11946"
