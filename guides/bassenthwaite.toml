[[fact]]
topic = "rules"
text = "The park authority's lakes guide lists swimming at Bassenthwaite as allowed. Canoes, kayaks, paddleboards, rowing and sailing boats need a boating permit; powered craft are generally not allowed under the small lakes byelaws. It asks visitors to be mindful that the lake is a National Nature Reserve and a Site of Special Scientific Interest."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/things-to-do/on-the-water/lakes-activities-guide/"
