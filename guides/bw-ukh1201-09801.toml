[[fact]]
topic = "path"
text = "You can reach Sheep's Green and Coe Fen from Fen Causeway, Lammas Land, Mill Lane and Trumpington Road. A firm, level path runs around the sites, but it can be hard to use in wet weather."
status = "confirmed"
source = "https://www.cambridge.gov.uk/sheeps-green-and-coe-fen-local-nature-reserve"
source_name = "Cambridge City Council"

[[fact]]
