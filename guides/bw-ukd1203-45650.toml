# Windermere, Millerground Landing. Desk check of the operator's pages and the Environment Agency profile, 3 October 2026.
# Prices and hours change by season: recheck every confirmed fact before changing "checked".
checked = 2026-10-03
how = "desk"

[[fact]]
topic = "entry"
text = "The Environment Agency says the beach at Millerground is very shallow sloping and made of gravel, with larger rocks towards the water's edge."
status = "confirmed"
source = "https://environment.data.gov.uk/bwq/profiles/profile.html?site=ukd1203-45650"
source_name = "Environment Agency bathing water profile"

[[fact]]
topic = "path"
text = "The National Trust's access statement (dated April 2018) says the route down to Low Millerground is steep but well surfaced. It says the lakeshore path is mostly level, with some narrow sections and drops to the shore."
status = "confirmed"
source = "https://nt.global.ssl.fastly.net/binaries/content/assets/website/national/regions/lake-district/places/stagshaw-garden-and-ambleside/pdf/stagshaw-garden-and-ambleside-access-statement.pdf"
source_name = "National Trust"

[[fact]]
topic = "parking"
text = "The same April 2018 National Trust statement says a small free layby by the gate to Low Millerground holds about 8 cars."
status = "confirmed"
source = "https://nt.global.ssl.fastly.net/binaries/content/assets/website/national/regions/lake-district/places/stagshaw-garden-and-ambleside/pdf/stagshaw-garden-and-ambleside-access-statement.pdf"
source_name = "National Trust"

[[fact]]
topic = "parking"
text = "The National Park Authority lists Hammarbank pay and display car park, 600 metres north-west of Windermere town, as handy for short walks to the Millerground lakeshore and woodlands."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/visitor-facilities/car-parks-and-parking/"
source_name = "Lake District National Park Authority"

[[fact]]
topic = "toilets"
text = "The town council runs toilets at Rayrigg Meadow car park (Millerground), open 7am to 7pm, with a Changing Places room opened by Radar key. Its toilets cost 60p, contactless only; Radar key holders use them free."
status = "confirmed"
source = "https://www.windermere-tc.gov.uk/council-services/public-toilets/"
source_name = "Windermere and Bowness Town Council"

[[fact]]
topic = "rules"
text = "The National Park Authority says swimming is allowed on Windermere. Powered craft must be registered, and there is a 10 nautical mph speed limit, or 6 in some places. The page is about the whole lake and does not name the bathing site."
status = "confirmed"
source = "https://lakedistrict.gov.uk/explore/things-to-do/on-the-water/lakes-activities-guide/"
source_name = "Lake District National Park Authority"
