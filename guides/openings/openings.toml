# Spot openings: two or three sentences of plain fact about each place, for its page ("The place", before the
# practical guide), its description in search results and its structured data. src/dipcast/openings.py reads this
# file; docs/DESIGN.md, "A spot's opening", says how the page shows it.
#
# Each entry is the hand-written part: one or two sentences on the water and how people reach it. The build adds one
# sentence of its own from that run's trace of the river network (the monitored storm overflows upstream, whose they
# are, how many report live, the nearest), so that part never goes stale here.
#
# The rules, which tests/test_openings.py checks:
# - Every fact is from a page the entry lists in `sources` (the landowner's, a council's, a national park's, the
#   Environment Agency's bathing water profile), or from what the site already shows (the river, the lake and its
#   size in km², which the site takes from the Environment Agency's lake outlines). For a spot with a practical guide
#   the entry restates facts already in it, from the same pages, and `checked` is the day the guide gives; the others'
#   pages were read on 10 November 2026.
# - No safety claim, no verdict on the water, no advert's words ("popular", "best", "stunning"). Permission is said
#   only as the source says it, and named as theirs. Prices and opening hours stay in the guide, where they are dated.
# - One or two sentences, at most 330 characters.
#
# Which spots (10 November 2026). The 40 most-visited spot pages, ranked by the spot-page visits in the weekly counts
# for the weeks starting 19 Oct, 26 Oct and 2 Nov 2026, summed (the figures themselves are private and not in this
# repository). Those weeks name 26 spots; the other 14 are the rest of the Cumbria and Lake District focus area that
# Ethan chose on 25 Oct 2026, in that list's order. The entries below are in that order.

[ribble-stainforth-force]
text = "Stainforth Force is on the River Ribble, a walk from the Yorkshire Dales National Park Authority's car park in Stainforth village. The Authority's route follows the Pennine Bridleway signs under the road and over the railway, crosses a narrow packhorse bridge and takes the footpath through the fields to the falls."
checked = 2026-10-29
sources = [
  { name = "Yorkshire Dales National Park Authority", url = "https://www.yorkshiredales.org.uk/places/stainforth_force/" },
  { name = "Yorkshire Dales National Park Authority: car parks", url = "https://www.yorkshiredales.org.uk/plan-your-visit/essential-information/car-parks-and-toilets/" },
]

