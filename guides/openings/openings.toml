[derwent-water-calfclose]
text = "Calfclose Bay on Derwent Water is 250 m across the road from the National Trust's Great Wood car park, 1.8 miles outside Keswick on the B5289, and a 15-minute walk from Keswick Launch's Ashness Gate jetty. The National Park Authority says swimming is allowed on Derwentwater, as are boats, with a 10 mph limit for powered craft."
