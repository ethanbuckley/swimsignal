name = "swimsignal-push"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "PUSH"
id = "fefed2f744ec4cf7a9aea6eddfc3f74b"

[triggers]
crons = ["*/2 * * * *"]   # queued alerts go out in batches; see README

[vars]
SITE_URL = "https://swimsignal.co.uk/"
ALLOWED_ORIGIN = "https://swimsignal.co.uk"
VAPID_SUBJECT = "mailto:hello@swimsignal.co.uk"
VAPID_PUBLIC_KEY = "BGaPAD3oYd4cJ3jJPMF9b8gyImfQ1H7Xtw5nOfSuYx7vLeIjmqlQ9wmcPqXlwMRRx-yzPeNmKs4H3RhDSjgb3OY"
# SENDS_PER_RUN = "15"   # alerts per run; raise it on the Workers Paid plan (README)
# VAPID_PRIVATE_KEY is a secret, not a var. Set it with:
#   npx wrangler secret put VAPID_PRIVATE_KEY
# Never write it in this file. This file is committed, so anything here is public.

# Email alerts (README, "Email alerts"): off until the two secrets MAIL_API_KEY and MAIL_HASH_KEY
# are set as well as these. Until then every /email/ address answers 404.
EMAIL_FROM = "SwimSignal <alerts@swimsignal.co.uk>"
EMAIL_REPLY_TO = "hello@swimsignal.co.uk"
WORKER_URL = "https://swimsignal-push.swimsignal-push.workers.dev/"   # this Worker's own address, for the links in emails
# EMAIL_DAILY_CAP = "100"       # the email service's daily allowance (Resend's free plan: 100)
# EMAIL_CONFIRM_RESERVE = "20"  # kept back from alerts each day for confirmation emails
# EMAILS_PER_RUN = "10"         # alert emails per 2-minute run
