name: Build and publish site

on:
  schedule:
    # Asks for every 30 minutes. GitHub treats schedules as best effort: 7 Oct-6 Nov 2026 the scheduled
    # builds were a median 4.6 h apart, p95 7.7 h, at most 10.1 h (PR #634). No step may depend on the clock time.
    - cron: "*/30 * * * *"
  # Two ways to a build every 30 minutes, both off until switched on; this schedule stays as the restart:
  #  - the job next-build below, with the repository variable SELF_PACE set to 1 (needs no token);
  #  - the push Worker, once its token is set (push/README.md, "Starting the site's build").
  workflow_dispatch:
    inputs:
      chain:
        description: "Leave unticked. Ticked only by next-build, the build's own request for the next build."
        type: boolean
        default: false
  push:
    branches: [main]
    # The two hand-checked data files change what is counted where, so a push of either builds too
    # (until 12 Oct 2026 they waited for the next scheduled run, a median 2.9 h).
    # The four scripts build_site.py runs as files are listed too: #413's fix to build_any_point.py
    # (27 Oct 2026) did not rebuild the site.
    paths: [spots.csv, spots-osm.csv, "src/**", scripts/build_site.py, .github/workflows/site.yml,
            data/raw/overflow_joins.csv, data/raw/network_fixes.csv,
            scripts/build_any_point.py, scripts/alerts.js, scripts/prerender_spots.js, scripts/prerender_verification.js]

concurrency:
  group: site
  cancel-in-progress: false

# Each job asks for what it uses. GH_TOKEN is given only to the steps that run gh or push, and
# the checkout does not keep its token in .git/config, so the tests and the build (which run code
# from the repository) never hold a token.
permissions:
  contents: read

env:
  DIPCAST_STATE: ${{ github.workspace }}/state
  DIPCAST_CACHE: ${{ github.workspace }}/state/cache   # rainfall cache persists with the state
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write     # release assets for state, heartbeat commit
      actions: read       # whether Test Python passed this commit (step tested)
    outputs:
      host: ${{ steps.host.outputs.host }}
      started: ${{ steps.host.outputs.started }}
    steps:
      - name: Choose the host (Cloudflare Pages once its token is set, else GitHub Pages)
        id: host
        env:
          # Only whether the secret is set reaches this job, never its value (docs/HOSTING-MOVE-2026-10.md).
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_CLOUDFLARE" = true ]; then host=cloudflare; else host=github; fi
          echo "Publishing to: $host"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%s)" >> "$GITHUB_OUTPUT"   # next-build paces the next run from this

      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # the heartbeat step pushes with GH_TOKEN instead

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        # h5py (the `radar` group) only for the radar shadow (docs/RADAR-SHADOW-2026-11.md); unset = not installed.
        run: uv sync --frozen ${{ vars.DIPCAST_RADAR_SHADOW == '1' && '--extra radar' || '' }}

      # The same tests on the same commit need not run twice. A scheduled or chained build mostly builds a commit
      # that Test Python (python-tests.yml: lint, then this same pytest) already passed when it was pushed to main,
      # hours before. Only that exact commit, pushed to main, with a successful run counts; anything else, a failed
      # lookup included, runs the tests here. A push build usually starts with Test Python, so it runs them here.
      - name: Did Test Python already pass this commit on main?
        id: tested
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/python-tests.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" \
                --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\" and .event == \"push\" and .head_branch == \"main\")] | length" 2>&1) || n=0
          if [[ $n =~ ^[1-9][0-9]*$ ]]; then
            echo "Test Python passed $GITHUB_SHA on main ($n run(s)): not running the same tests again."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful Test Python run of $GITHUB_SHA on main found (${n:-none}): the tests run here."
          fi

      - name: Tests (the build does not run if these fail)
        if: steps.tested.outputs.passed != 'true'
        # On the runner's four cores (pytest-xdist): 6 Nov 2026, 2,189 tests in 193 s against 381 s one at a time.
        run: uv run pytest -q -n auto

      - name: Restore mutable state (live history, forecast log)
        id: state-cache
        uses: actions/cache/restore@v6
        with:
          path: state
          key: dipcast-state-${{ github.run_id }}
          restore-keys: dipcast-state-

      - name: Fetch state from the rolling release if the cache was cold
        if: steps.state-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          # Only a missing release means a first run. Any other failure stops the build: an empty
          # state would start a new forecast log, and the publish step would then replace the
          # release's copy with it.
          if ! out=$(gh release view state --json name 2>&1); then
            case "$out" in
              *"release not found"*) echo "no state release yet"; exit 0 ;;
            esac
            echo "::error title=state release::could not read the state release: $out"
            exit 1
          fi
          gh release download state -D state --clobber

      - name: Fetch the river network (113 MB, too large for git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f data/processed/river_network.pkl || gh release download data-v1 -p river_network.pkl -D data/processed

      - name: Build forecasts and site
        env:
          DIPCAST_CF_BEACON_TOKEN: ${{ vars.DIPCAST_CF_BEACON_TOKEN }}   # page-view counter; unset = off
          DIPCAST_SITE_URL: ${{ vars.DIPCAST_SITE_URL }}   # custom domain for share links; unset = the Pages address
          # Alerts (push/README.md): the Worker's address and its public key; unset = no alerts button.
          DIPCAST_PUSH_URL: ${{ vars.DIPCAST_PUSH_URL }}
          DIPCAST_VAPID_PUBLIC_KEY: ${{ vars.DIPCAST_VAPID_PUBLIC_KEY }}
          # Alerts for a date (push/README.md): 1 once the Worker that takes dates is deployed; unset = no date alerts.
          DIPCAST_PUSH_DATES: ${{ vars.DIPCAST_PUSH_DATES }}
          # Alerts for official advice at a saved spot (push/README.md): 1 once the Worker that sends them is deployed.
          DIPCAST_PUSH_ADVICE: ${{ vars.DIPCAST_PUSH_ADVICE }}
          # Back to low risk, asked for on a raised spot's page (push/README.md): 1 once the Worker that takes the requests is deployed.
          DIPCAST_PUSH_CLEARS: ${{ vars.DIPCAST_PUSH_CLEARS }}
          # Email alerts (push/README.md, "Email alerts"): the Worker's address; unset = no email sign-up.
          DIPCAST_EMAIL_URL: ${{ vars.DIPCAST_EMAIL_URL }}
          # Reviews (reviews/README.md): the review Worker's address; unset = no reviews on the site.
          DIPCAST_REVIEWS_URL: ${{ vars.DIPCAST_REVIEWS_URL }}
          # Ask SwimSignal (ask/README.md): the Ask Worker's address; unset = no question tile on Plan a swim.
          DIPCAST_ASK_URL: ${{ vars.DIPCAST_ASK_URL }}
          # Action counts (actions/README.md): the counting Worker's address; unset = nothing counted, nothing sent.
          DIPCAST_ACTIONS_URL: ${{ vars.DIPCAST_ACTIONS_URL }}
          # Tips (README, "Tips"): a Ko-fi page's address; unset = no support page or links.
          DIPCAST_KOFI_URL: ${{ vars.DIPCAST_KOFI_URL }}
          # Map tiles (README, "Map tiles"): a provider in build_site.TILE_PROVIDERS and its key; unset = OpenStreetMap.
          DIPCAST_TILES: ${{ vars.DIPCAST_TILES }}
          DIPCAST_TILE_KEY: ${{ vars.DIPCAST_TILE_KEY }}
          # Scottish Water shadow (Scotland plan S4, S5): 1 polls and scores in state only, publishes nothing; unset = off.
          DIPCAST_SCOTTISH_WATER: ${{ vars.DIPCAST_SCOTTISH_WATER }}
          # Scotland trial (src/dipcast/scotland_trial.py): 1 lists Scotland's trial spots and forecasts them with
          # Scotland's overflows and calibration; needs the setting above too; unset = off.
          DIPCAST_SCOTLAND_TRIAL: ${{ vars.DIPCAST_SCOTLAND_TRIAL }}
          # Radar shadow (docs/RADAR-SHADOW-2026-11.md): 1 fetches the Met Office radar for the build's rain cells and logs
          # shadow_radar_v1 in state only, publishes nothing; unset = off.
          DIPCAST_RADAR_SHADOW: ${{ vars.DIPCAST_RADAR_SHADOW }}
          # Open-Meteo's paid plan (README, "Rainfall API"): its key; unset = the free, non-commercial API.
          # In this step only, so the tests never hold it; the code keeps it out of logs and pages.
          DIPCAST_OPEN_METEO_KEY: ${{ secrets.DIPCAST_OPEN_METEO_KEY }}
        run: uv run python scripts/build_site.py

      - name: Save mutable state
        uses: actions/cache/save@v6
        if: always()
        with:
          path: state
          key: dipcast-state-${{ github.run_id }}

      - name: Publish state to the rolling release (durable copy, when over 12 hours old)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain }}   # true only in a run next-build asked for: not a manual run
        run: |
          # GitHub runs the schedule a few times a day at irregular times, so a fixed clock window
          # was missed for a week at a time. Publish when the release copy of any of these files is
          # over max_h hours old or missing (a failed --clobber upload deletes it), and on every
          # manual run. A run next-build asked for is not manual: with SELF_PACE on, 48 a day.
          # All files go up together, so the copy is one run's snapshot.
          max_h=12
          files=(state/live_history.parquet state/live_latest.parquet state/dipcast.duckdb state/verification_live.json)
          for f in state/live_coverage.parquet state/poll_log.parquet state/ecoli_samples.parquet state/ecoli_samples_status.json state/water_temp_estimates.parquet; do
            if [ -f "$f" ]; then files+=("$f"); fi   # later additions, uploaded once the build has written them
          done
          # The issued-forecast history, one file a month (src/dipcast/issue_history.py): every month's, so a cold
          # cache gets them all back from the release.
          for f in state/issued-*.parquet; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          # The files republish the water companies' feeds (CC BY 4.0) and EA samples (OGL v3), so the
          # notes carry the credits, and are rewritten on every publish.
          notes="Live polls, forecast log and live scores, replaced twice a day by the site workflow. Contains storm overflow status from the English water companies via the National Storm Overflow Hub (CC BY 4.0) and Environment Agency data (© Environment Agency copyright and/or database right, OGL v3.0), combined by SwimSignal. Full credits and licences: the site's terms page, section Data sources and credits."
          if ! assets=$(gh release view state --json assets); then
            gh release create state --title "Rolling state" --notes "$notes" --latest=false
            assets='{"assets":[]}'
          fi
          stale=$(jq -r --argjson h "$max_h" --args '
              (now - $h*3600 | todate) as $cutoff | (.assets | map({(.name): .updatedAt}) | add // {}) as $up
              | [$ARGS.positional[] | select(($up[.] // "") < $cutoff)] | join(" ")
            ' "${files[@]#state/}" <<<"$assets") || stale="(could not read the release's assets)"
          manual=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CHAIN" != true ]; then manual=true; fi
          if [ "$manual" = true ] || [ -n "$stale" ]; then
            echo "Publishing ${#files[@]} files. Over $max_h h old or missing in the release: ${stale:-none (manual run)}"
            # The forecast log only grows. A copy with fewer logged forecasts than the release's
            # means this run started from a lost or partial state: refuse rather than replace it.
            count='import sys, duckdb; print(duckdb.connect(sys.argv[1], read_only=True).execute("SELECT count(*) FROM forecast_overflows").fetchone()[0])'
            if jq -e '.assets | any(.name == "dipcast.duckdb")' <<<"$assets" >/dev/null; then
              gh release download state -p dipcast.duckdb -D "$RUNNER_TEMP/release-state" --clobber
              old_n=$(uv run python -c "$count" "$RUNNER_TEMP/release-state/dipcast.duckdb")
              new_n=$(uv run python -c "$count" state/dipcast.duckdb)
              echo "forecast_overflows rows: release $old_n, this run $new_n"
              if [ "$new_n" -lt "$old_n" ]; then
                echo "::error title=state release::this run's forecast log has $new_n rows, the release's $old_n; not replacing it"
                exit 1
              fi
            fi
            gh release upload state "${files[@]}" --clobber
            gh release edit state --notes "$notes"
          else
            echo "All ${#files[@]} release copies are under $max_h h old; not publishing."
          fi

      - name: Heartbeat commit once the last is 25 days old (GitHub disables schedules after 60 idle days)
        # Also in next-build's runs: with SELF_PACE on, the group is always busy, so a scheduled run waits and
        # the next request replaces it, and a schedule-only heartbeat would never run.
        if: github.event_name == 'schedule' || inputs.chain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Scheduled runs start a few times a day at irregular times, so a fixed clock window can be
          # missed for months. The first scheduled run after HEARTBEAT.md is max_d days old commits a
          # new one. A missing file, or a first line that is not a past date in the form written here,
          # counts as due. A failed push (main moved on since checkout, say) is retried by the next run.
          max_d=25
          fmt="%Y-%m-%d %H:%M UTC"
          now=$(date -u +%s)
          last=$(head -n 1 HEARTBEAT.md 2>/dev/null || true)
          # date -d reads "" as today's midnight and "now" as now, so check the written form first.
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} UTC$'
          if [[ $last =~ $re ]] && last_s=$(date -u -d "$last" +%s) && [ "$last_s" -le "$now" ]; then
            due_s=$(( last_s + max_d * 86400 ))
            echo "Last heartbeat $last; the next is due from $(date -u -d "@$due_s" +"$fmt")."
          else
            due_s=$now
            echo "HEARTBEAT.md is missing or its first line is not a past date like $(date -u +"$fmt"): '$last'"
          fi
          if [ "$now" -ge "$due_s" ]; then
            git config user.name "dipcast-bot"; git config user.email "bot@dipcast.invalid"
            date -u +"$fmt" > HEARTBEAT.md && git add HEARTBEAT.md && git commit -m "Heartbeat (keeps the site schedule enabled)" \
              && git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main
          fi

      # Both hosts take this artifact: GitHub Pages directly, Cloudflare Pages unpacked (deploy-cloudflare).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true   # since v4 dotfiles are left out by default; the build writes site/.nojekyll

  deploy:
    needs: build
    if: needs.build.outputs.host == 'github'
    runs-on: ubuntu-latest
    permissions:
      pages: write        # to deploy to Pages
      id-token: write     # to prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Cloudflare Pages (docs/HOSTING-MOVE-2026-10.md), once the secret CLOUDFLARE_API_TOKEN is set. GitHub's
  # terms do not allow an online business on GitHub Pages. Its own job, so the token is never in a job
  # that runs code from the repository: this one only unpacks the build's artifact and runs wrangler.
  deploy-cloudflare:
    needs: build
    if: needs.build.outputs.host == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}       # the artifact comes from this run, which needs no token
    environment:
      name: cloudflare-pages
      url: https://swimsignal.co.uk/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact

      - name: Unpack the site and add Cloudflare's headers file
        run: |
          mkdir site
          tar -xf "$RUNNER_TEMP/artifact/artifact.tar" -C site
          # GitHub Pages sends Access-Control-Allow-Origin: * on every file, so the data files can be
          # read from other sites; keep that. The pages.dev copies stay out of search results.
          cat > site/_headers <<'HEADERS'
          /*
            Access-Control-Allow-Origin: *

          https://:project.pages.dev/*
            X-Robots-Tag: noindex

          https://:version.:project.pages.dev/*
            X-Robots-Tag: noindex
          HEADERS
          echo "$(find site -type f | wc -l) files, $(du -sh site | cut -f1)"

      - uses: actions/setup-node@v7
        with:
          node-version: 22    # wrangler 4 needs Node 22 or later

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'swimsignal' }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare::the secret CLOUDFLARE_API_TOKEN is set but the variable CLOUDFLARE_ACCOUNT_ID is not (docs/HOSTING-MOVE-2026-10.md)"
            exit 1
          fi
          # --branch=main is the project's production branch, so this replaces what swimsignal.co.uk serves.
          npx --yes wrangler@4.146.0 pages deploy site --project-name="$PROJECT" --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="site.yml run $GITHUB_RUN_ID" --commit-dirty=true

  # A build about every 30 minutes without a token: off unless the repository variable SELF_PACE is 1.
  # Each run on main asks GitHub for the next run, GAP_MIN minutes after its own build started, with the
  # workflow's own token. GitHub starts a run from a workflow_dispatch sent with GITHUB_TOKEN: tested 6 Nov 2026
  # on a throwaway branch (the run showed github-actions[bot] as its triggering actor).
  # It cannot pile up. The group "site" holds one running run and one waiting; a newer run replaces the waiting
  # one (cancel-in-progress: false never cancels a running one). Each run asks for one, so one chain at most;
  # a scheduled or push run that waits is replaced by the request, which builds main as it then is.
  # It runs after a failed build too, so one failure does not wait hours for the schedule; not after a cancel,
  # so cancelling a run stops the chain until the schedule's next run starts it again. It never fails the run.
  # Cost: the wait is GAP_MIN less the build job (about 14 min), so about 16 runner minutes a run, about 13 h a
  # day at 48 runs; free, as the repository is public. Open-Meteo: the refresh floors keep the day's calls under
  # rainfall.DAILY_CALLS however many builds run, but at 48 a day the D4 ensemble gets no spare calls
  # (rainfall.PLANNED_DAY_CALLS), so it stays off until D4 is read (21 Nov 2026).
  next-build:
    needs: build
    if: ${{ !cancelled() && vars.SELF_PACE == '1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      actions: write      # to ask for the next run; nothing else, and no checkout: it runs no code from the repository
    steps:
      - name: Wait until GAP_MIN minutes after this build started, then ask for the next run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.build.outputs.started }}
          GAP_MIN: "30"
        run: |
          now=$(date -u +%s)
          # No start time (the build job stopped before writing it): wait the whole gap, so a build that
          # fails at once cannot ask again within the minute.
          if [[ $STARTED =~ ^[0-9]+$ ]]; then start=$STARTED; else start=$now; fi
          wait_s=$(( start + GAP_MIN * 60 - now ))
          if [ "$wait_s" -gt 0 ]; then
            echo "Waiting $wait_s s, until $GAP_MIN min after this build started."
            sleep "$wait_s"
          fi
          if gh workflow run site.yml -R "$GITHUB_REPOSITORY" --ref main -f chain=true; then
            echo "Asked for the next build."
          else
            echo "::warning title=next-build::could not ask for the next build; the schedule starts the chain again"
          fi
