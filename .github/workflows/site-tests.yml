name: Test site interactions
on:
  pull_request:
    paths: ["src/dipcast/site/**", "src/dipcast/pages/**", "tests/site_*.test.cjs", "reviews/src/rules.js", ".github/workflows/site-tests.yml"]
  push:
    branches: [main]
    paths: ["src/dipcast/site/**", "src/dipcast/pages/**", "tests/site_*.test.cjs", "reviews/src/rules.js", ".github/workflows/site-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tests/site_*.test.cjs
