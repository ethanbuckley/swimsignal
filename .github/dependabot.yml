# Monthly dependency refresh: one grouped pull request per ecosystem, so updates arrive as a
# batch to test once rather than one pull request per package.
# There is no npm entry: push/ and reviews/ have package.json files for their test scripts only,
# with no dependencies and no lock file.
# The repository has no required checks, so a dependency pull request must not be auto-merged:
# wait for "Test Python" (and the site tests, for action bumps) to pass, then merge by hand.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"           # pyproject.toml and uv.lock
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"           # every workflow in .github/workflows, site.yml included
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
