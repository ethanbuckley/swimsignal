[project]
name = "dipcast"
version = "0.1.0"
description = "Probabilistic sewage-pollution forecasts for river and lake swim spots in England, from open storm-overflow, rainfall and river-network data."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "geopandas>=1.0",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "segno>=1.6",
    "pillow>=11",   # the social cards (src/dipcast/cards.py); reads the site's WOFF2 fonts
]

[project.optional-dependencies]
bayes = ["pymc>=5.16", "arviz>=0.19"]
nn = ["torch>=2.4"]   # scripts/train_nn.py only (docs/NEURAL-CHALLENGER-TEST-2026-10.md); the build never installs it

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "openpyxl>=3.1", "feedparser>=6.0"]   # openpyxl: scripts/fetch_sw_history.py reads Scottish Water's xlsx; feedparser: tests/test_feeds.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dipcast"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes and the pycodestyle errors, named so that ruff releases with wider defaults check the same.
select = ["E4", "E7", "E9", "F"]
# House style: short one-line helpers (`f = lambda ...`, `a; b`) and `l` for a list or line.
ignore = ["E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Scripts and their tests put scripts/ on sys.path, or load a script by path, before importing it.
"scripts/**" = ["E402"]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
